<script>
  // Layout size for the [data-size] rules: lg, md or sm. Content runs the full
  // width with a fixed edge padding, so text starts on whole pixels (type16 is
  // only sharp there) without any centring maths. The sizes are flow's
  // (cmd/landing): lg leaves 1072 px inside the padding, md 688 px at least.
  (function () {
    const de = document.documentElement;
    function fit() {
      const vw = de.clientWidth;
      de.dataset.size = vw >= 1152 ? 'lg' : vw >= 768 ? 'md' : 'sm';
    }
    fit();
    addEventListener('resize', fit);
  })();
</script>

  /* Sizes are 17, 34, 51 or 68px only (1, 2, 3, 4 px per font dot), with line
     heights that keep the baseline on a whole pixel. The tokens are flow's. */
  :root {
    --bg: #111; --bg2: #161616; --surf: #1c1c1c; --line: #2a2a2a; --line2: #3a3a3a;
    --fg: #e6e6e6; --muted: #8a8a8a; --dim: #5c5c5c;
    --primary: #ff5f00; --primary-shade: #cc4c00;  /* shade: 80 % of primary, for offset shadows */
    --led-gap: #0a0a0a; --led-off: #141414; --led-on: #f4f4f4;  /* the sea's colours, which the bar shares */
    --pad-x: 40px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { background: var(--bg); color: var(--fg); scroll-behavior: smooth; scroll-padding-top: 69px; }  /* anchors land under the stuck bar */
  body { margin: 0; font: 17px/27px "type16", ui-monospace, monospace; -webkit-font-smoothing: none; font-kerning: none;

  ::selection { background: var(--primary); color: var(--bg); }
  .wrap { width: 100%; padding: 0 var(--pad-x); }  /* full width, no column: only an edge padding */
  .muted { color: var(--muted); }
  .dim { color: var(--dim); }
  .p { color: var(--primary); }
  h1, h2, h3, p { margin: 0; font-weight: normal; }

  /* the sea: the dots fill the first view down to the bar */
  .screen { height: calc(100vh - 69px); min-height: 391px; display: flex; flex-direction: column; background: var(--led-gap); }
  .screen canvas { flex: 1; min-height: 0; width: 100%; display: block; cursor: crosshair; }
  /* the bar under the sea: logo and links, in the sea's colours. Its inside is 65 px
     (odd), so the 43 px links, and the 48 px logo with 1 px under it, sit on whole pixels. */
  .screen-bar { position: sticky; top: 0; z-index: 10; min-height: 69px; background: var(--led-gap); color: var(--led-on);
                border-top: 2px solid var(--led-off); border-bottom: 2px solid var(--line); display: flex; align-items: center; }
  .screen-bar .wrap { display: flex; align-items: center; gap: 24px; }
  .screen-bar .wrap > * { white-space: nowrap; }
  .screen-bar .brand { display: block; margin-bottom: 1px; }
  .screen-bar .links { display: flex; }
  .screen-bar .links a { color: color-mix(in srgb, var(--led-on) 70%, var(--led-gap)); padding: 8px 12px; }
  .screen-bar .links a:hover { color: var(--led-on); }
  /* logos: type16's dots on a block, the first letter in primary, as in each repository's docs/logo-*.svg */
  .mark { display: block; shape-rendering: crispEdges; }
  .mark .blk { fill: var(--led-on); } .mark .acc { fill: #e65600; } .mark .ink { fill: var(--led-gap); }

  /* phone */
  [data-size=sm] { --pad-x: 20px; }
  [data-size=sm] .screen-bar .links { display: none; }
  [data-size=sm] .screen-bar .wrap { gap: 12px; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>
</head>
<body>

<header class="screen" id="top">
  <canvas id="sea" role="img" aria-label="The word aquatic afloat on a sea of dots, rising and falling with slow waves"></canvas>
</header>
<nav class="screen-bar" aria-label="Main">
  <div class="wrap">
    <a class="brand" href="#top" aria-label="Aquatic home">
      <!-- the favicon: an a with a tail on primary, 16x16 dots, 3 px a dot -->
      <svg class="mark" width="48" height="48" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true"><rect width="16" height="16" fill="#ff5f00"/><path fill="#111111" d="M5 3h6v1h-6zM4 4h8v1h-8zM4 5h2v1h-2zM10 5h2v2h-2zM5 7h7v1h-7zM4 8h8v1h-8zM4 9h2v2h-2zM10 9h2v2h-2zM4 11h9v1h-9zM5 12h5v1h-5zM11 12h2v1h-2z"/></svg>
    </a>
    <div class="links"><a href="https://aquatic.dev/flow">Flow</a><a href="https://aquatic.dev/catalog">Catalog</a><a href="https://github.com/unaquatic">GitHub</a></div>
  </div>
</nav>

<script>
const $ = (s, el = document) => el.querySelector(s);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

// --- the sea and the wordmark ---------------------------------------------
// flow's dot ocean: a water surface seen in perspective, drawn as scattered
// dots on the cell grid. Each dot sits at a fixed spot and only rises and
// falls, by standing swells with deep-water timing (w = sqrt(g k)), and is
// shaded by Fresnel reflection of the sky, crest light through thin water and
// haze; the shade picks one of 8 colours from Trough to Lit. Stars blink in
// the sky over the horizon. The pointer raises a gentle swell.
//
// On it floats "aquatic" in type16's ss01, k cells a font dot. Each letter rides the
// mean height of the water under it, so a swell runs along the word. The
// water line moves by the waves under each column: above it a letter is lit,
// with the sea cleared one cell round it; under it the letter is dimmed and
// bent sideways, as seen through water, and the water mirrors what is above
// it in broken streaks. The first letter is in primary, as in every logo.
(() => {
  const PRIMARY = getComputedStyle(document.documentElement).getPropertyValue('--primary').trim();
  const C = {
    cell: 3, gapPct: 5,                        // cell px at every width, as flow's; gap in % of a cell
    colGap: '#0a0a0a', colOff: '#141414', colOn: '#f4f4f4', colDeep: '#1c1c1c',
    height: 50, chop: 195, density: 100,       // %: wave height, shorter waves, dots
    horizon: 0, stars: 100,                    // %: sky over the sea, of the height (none: the sea fills it); stars in the sky
    sunHeight: 16, sunDir: 0, glint: 0, crest: 155, speed: 10,
    wordSize: 52,                              // % of the canvas width the word takes at most (72 % at least on a phone)
    waterline: 58,                             // % of the sea under the horizon, top down: where the word floats
    sink: 0,                                   // font dots of the word under calm water
    bob: 35, swell: 45, lift: 45,              // % of the sea's rise that moves the letters, the water line; the pointer's swell moves both
  };
  const SWELLS = [  // wavelength (world units, camera 1 unit above the sea), direction, spatial phase, time phase
    { len: 7.0, dir: 0.35, ph: 0.4, tp: 1.7 }, { len: 5.2, dir: 2.10, ph: 2.2, tp: 0.3 },
    { len: 3.6, dir: 1.15, ph: 4.0, tp: 2.9 }, { len: 2.6, dir: 2.75, ph: 1.1, tp: 4.4 },
    { len: 1.8, dir: 0.80, ph: 5.3, tp: 3.6 }, { len: 1.25, dir: 1.95, ph: 3.1, tp: 0.9 },
  ];
  const LEVELS = 8, Z_NEAR = 1, Z_MIN = 0.3, CAM_H = 1, F0 = 0.02, G = 9.8;
  // "aquatic" as type16 sets it in ss01, its proportional set, read dot by dot
  // from the font's own rendering: rows top down, the x-height rows 3 to 12,
  // q's descender under them. The letters are the runs of columns between
  // empty ones, SPANS; LETTER maps a column to its letter.
  const WORD = [
    '......................................##....##.........',
    '......................................##....##.........',
    '......................................##...............',
    '.######...######..##....##..######..######.###..######.',
    '########.########.##....##.########.######.###.########',
    '##....##.##....##.##....##.##....##...##....##.##....##',
    '......##.##....##.##....##.......##...##....##.##....##',
    '.#######.##....##.##....##..#######...##....##.##......',
    '########.##....##.##....##.########...##....##.##......',
    '##....##.##....##.##....##.##....##...##....##.##....##',
    '##....##.##....##.##....##.##....##...##....##.##....##',
    '########.########.########.########...####..##.########',
    '.######...#######..#######..######.....###..##..######.',
    '...............##......................................',
    '...............##......................................',
    '...............##......................................',
  ];
  const WW = WORD[0].length, WH = WORD.length, BASE = 13;
  const SPANS = [];
  for (let x = 0; x < WW; x++) {
    if (!WORD.some((r) => r[x] === '#')) continue;
    if (SPANS.length && SPANS.at(-1)[1] === x) SPANS.at(-1)[1] = x + 1; else SPANS.push([x, x + 1]);
  }
  const LETTER = new Int32Array(WW).fill(-1);
  SPANS.forEach(([from, to], i) => LETTER.fill(i, from, to));

  const cv = $('#sea'), ctx = cv.getContext('2d');
  const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const mix = (a, b, t) => { const B = hex(b); return `rgb(${hex(a).map((v, i) => Math.round(v + (B[i] - v) * t)).join(',')})`; };
  let cols = 0, rows = 0, cell = 3, cd = 3, gap = 1, dpr = 1;
  let N = 0, wx = new Float32Array(0), wz = new Float32Array(0), haze = new Float32Array(0);
  let S = new Float32Array(0), Q = new Float32Array(0), K = [];
  let shadeAt = new Float32Array(0), hitN = new Uint8Array(0), touched = new Int32Array(0);
  let lists = [], starCells = [], starPhase = [], F = 1, horizonY = 0;
  const grid = document.createElement('canvas');
  let visible = true, last = 0;
  const t0 = performance.now(), start = Math.round(Math.random() * 1200) / 10;  // wave time (s) the page opens on
  const pointer = { x: 0, y: 0, a: 0, on: false };

  // the word: k cells a font dot, its left column, the calm water line's row, its top row,
  // the depth it floats at; per word column: world x, each swell's sin, heights, water line
  let k = 1, wx0 = 0, wl0 = 0, wtop = 0, z0 = 1;
  let WX = new Float32Array(0), WS = new Float32Array(0), HW = new Float32Array(0), HB = new Float32Array(0), WL = new Int32Array(0);
  const LD = new Int32Array(SPANS.length);  // each letter's rise, in rows
  // What a cell of the word shows. Higher kinds win a cell: letter > submerged >
  // reflection > halo (the sea cleared round a letter).
  const HALO = 1, REFL = 2, REFL_ACC = 5, SUB = 8, SUB_ACC = 9, LIT = 10, LIT_ACC = 11;
  const RANK = [0, 1, 2, 2, 2, 2, 2, 2, 3, 3, 4, 4];
  const PAINT = [null, C.colOff,
    mix(C.colDeep, C.colOn, 0.34), mix(C.colDeep, C.colOn, 0.24), mix(C.colDeep, C.colOn, 0.15),     // reflection, fading
    mix(C.colDeep, PRIMARY, 0.42), mix(C.colDeep, PRIMARY, 0.3), mix(C.colDeep, PRIMARY, 0.2),
    mix(C.colDeep, C.colOn, 0.6), mix(C.colDeep, PRIMARY, 0.62),                                     // submerged
    C.colOn, PRIMARY];
  let mark = new Uint8Array(0), marked = new Int32Array(0), nm = 0;
  const buckets = PAINT.map(() => []);
  function put(i, v) {
    if (RANK[v] <= RANK[mark[i]]) return;
    if (!mark[i]) marked[nm++] = i;
    mark[i] = v;
  }

  function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  function fit() {
    const r = cv.getBoundingClientRect();
    dpr = Math.max(1, Math.round(devicePixelRatio || 1));
    cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
    cell = C.cell;
    cd = cell * dpr;
    gap = Math.min(cd - 1, cd * C.gapPct / 100);
    cols = Math.ceil(r.width / cell); rows = Math.ceil(r.height / cell);
    shadeAt = new Float32Array(cols * rows); hitN = new Uint8Array(cols * rows);
    mark = new Uint8Array(cols * rows); marked = new Int32Array(cols * rows);
    seed();
    placeWord(r.width);
    buildGrid();
    frame(performance.now(), true);
  }
  // Scatter dots over the surface, uniform on screen for a flat sea, so the
  // waves alone create the dense ridges. Dots also cover the water right in
  // front of the camera (down to Z_MIN, below the bottom edge when flat): a
  // near swell lifts that water into view, so it must never be empty.
  // Fixed seed keeps the pattern stable.
  function seed() {
    const rand = rng(1601), chop = C.chop / 100;
    horizonY = rows * C.horizon / 100;
    F = (rows - horizonY) * Z_NEAR / CAM_H;                     // flat sea at z = 1 meets the bottom edge
    const zMin = Z_MIN / Math.max(1, C.height / 100);          // taller waves lift water from closer by
    const syMax = horizonY + CAM_H * F / zMin;                  // flat-sea row of the nearest dots
    N = Math.round(cols * rows * 0.2 * C.density / 100 * (syMax - horizonY) / (rows - horizonY));
    K = SWELLS.map((s) => { const kk = Math.PI * 2 / s.len * chop; return { kx: kk * Math.cos(s.dir), kz: kk * Math.sin(s.dir), k: kk, ph: s.ph, tp: s.tp, a: 0.075 * s.len / chop }; });
    wx = new Float32Array(N); wz = new Float32Array(N); haze = new Float32Array(N);
    S = new Float32Array(N * K.length); Q = new Float32Array(N * K.length);
    for (let i = 0; i < N; i++) {
      const sy = horizonY + 0.6 + rand() * (syMax - horizonY - 0.6);  // screen row on a flat sea
      const z = CAM_H * F / (sy - horizonY), x = (rand() * 2 - 1) * (cols / 2) * z / F * 1.08;
      wx[i] = x; wz[i] = z;
      haze[i] = Math.exp(-(z - Z_NEAR) / 13);                       // aerial perspective
      for (let j = 0; j < K.length; j++) { const p = K[j].kx * x + K[j].kz * z + K[j].ph; S[j * N + i] = Math.sin(p); Q[j * N + i] = Math.cos(p); }
    }
    touched = new Int32Array(N);
    lists = Array.from({ length: LEVELS }, () => new Int32Array(N + 512));
    starCells = []; starPhase = [];
    const nStars = Math.round(cols * Math.max(0, horizonY - 2) * 0.0012 * C.stars / 100);
    for (let i = 0; i < nStars; i++) { starCells.push(Math.floor(rand() * Math.max(1, horizonY - 2)) * cols + Math.floor(rand() * cols)); starPhase.push(rand() * 100); }
  }
  // The word's size and place, as flow's: wordSize % of the canvas width at most
  // (72 % at least on a phone, where the word would be too small to read), and
  // 40 % of the sea's height, centred; its baseline sink dots under the calm
  // water line, waterline % down the sea.
  function placeWord(width) {
    const sea = rows - horizonY, size = width < 768 ? Math.max(C.wordSize, 72) : C.wordSize;
    k = Math.max(1, Math.min(Math.floor(width * size / 100 / (WW * cell)), Math.floor(sea * 0.4 / WH)));
    wx0 = Math.round((cols - WW * k) / 2);
    wl0 = Math.round(horizonY + sea * C.waterline / 100);
    z0 = CAM_H * F / (wl0 - horizonY);
    wtop = wl0 - (BASE - C.sink) * k;
    // the swells are standing waves, fixed in space: each one's sin under each column, once
    const n = WW * k;
    WX = new Float32Array(n); WS = new Float32Array(n * K.length);
    HW = new Float32Array(n); HB = new Float32Array(n); WL = new Int32Array(n);
    for (let c = 0; c < n; c++) {
      const x = (wx0 + c + 0.5 - cols / 2) * z0 / F;
      WX[c] = x;
      for (let j = 0; j < K.length; j++) WS[j * n + c] = Math.sin(K[j].kx * x + K[j].kz * z0 + K[j].ph);
    }
  }
  const size = () => cd - gap;
  // Unlit cells never change between frames: draw them once into a layer.
  function buildGrid() {
    grid.width = cv.width; grid.height = cv.height;
    const g = grid.getContext('2d');
    g.fillStyle = C.colGap; g.fillRect(0, 0, grid.width, grid.height);
    g.fillStyle = C.colOff;
    const s = size();
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) g.fillRect(x * cd + gap / 2, y * cd + gap / 2, s, s);
  }

  function frame(now, force = false) {
    if (!force && (!visible || now - last < 33)) return;
    last = now;
    const t = start + (now - t0) / 1000 * C.speed / 100, rt = reduce ? 0 : (now - t0) / 1000, hScale = C.height / 100, nk = K.length;
    // amplitude of each swell at this moment: A_k cos(w_k t + phase)
    const A = new Float32Array(nk), AX = new Float32Array(nk), AZ = new Float32Array(nk);
    let hMax = 1e-6;
    for (let j = 0; j < nk; j++) {
      const s = K[j], a = s.a * hScale;
      A[j] = a * Math.cos(Math.sqrt(G * s.k) * 0.32 * t + s.tp); AX[j] = A[j] * s.kx; AZ[j] = A[j] * s.kz; hMax += a;
    }
    // sun direction (toward the sun, which sits beyond the horizon)
    const el = C.sunHeight * Math.PI / 180, az = C.sunDir * Math.PI / 180;
    const Lx = Math.sin(az) * Math.cos(el), Ly = Math.sin(el), Lz = Math.cos(az) * Math.cos(el);
    const glint = C.glint / 100 * 2.4, crest = C.crest / 100 * 0.7;
    pointer.a += ((pointer.on ? 1 : 0) - pointer.a) * 0.06;
    let pxw = 0, pzw = 0, bump = 0;
    if (pointer.a > 0.01 && pointer.y > horizonY + 1) {     // pointer -> spot on the sea
      pzw = CAM_H * F / (pointer.y - horizonY); pxw = (pointer.x - cols / 2) * pzw / F; bump = 0.3 * pointer.a;
    }
    const bw = 0.5 + pzw * 0.06, half = cols / 2;
    const swellAt = (x, z) => { const dx = x - pxw, dz = (z - pzw) * 0.7; return bump * Math.exp(-(dx * dx + dz * dz) / bw); };
    let nt = 0;
    for (let i = 0; i < N; i++) {
      let h = 0, hx = 0, hz = 0;
      for (let j = 0; j < nk; j++) { const q = j * N + i, c = Q[q]; h += A[j] * S[q]; hx += AX[j] * c; hz += AZ[j] * c; }
      const x = wx[i], z = wz[i];
      if (bump) {
        const dx = x - pxw, dz = (z - pzw) * 0.7, b = bump * Math.exp(-(dx * dx + dz * dz) / bw);
        h += b; hx += b * -2 * dx / bw; hz += b * -2 * dz * 0.7 / bw;
      }
      const sx = (half + x * F / z) | 0, sy = (horizonY + (CAM_H - h) * F / z) | 0;
      if (sx < 0 || sy < 0 || sx >= cols || sy >= rows) continue;
      // surface normal n = (-hx, 1, -hz) and view direction v (point -> camera)
      let nx = -hx, ny = 1, nz = -hz; const nl = 1 / Math.sqrt(nx * nx + 1 + nz * nz); nx *= nl; ny *= nl; nz *= nl;
      let vx = -x, vy = CAM_H - h, vz = -z; const vl = 1 / Math.sqrt(vx * vx + vy * vy + vz * vz); vx *= vl; vy *= vl; vz *= vl;
      const ndv = Math.max(0, nx * vx + ny * vy + nz * vz);
      const fr = F0 + (1 - F0) * Math.pow(1 - ndv, 5);                       // Fresnel (Schlick)
      const rx = 2 * ndv * nx - vx, ry = 2 * ndv * ny - vy, rz = 2 * ndv * nz - vz; // view ray mirrored by the surface
      const sky = 0.12 + 0.75 * Math.pow(1 - Math.max(0, ry), 3);           // sky is brightest at the horizon
      const sun = Math.pow(Math.max(0, rx * Lx + ry * Ly + rz * Lz), 220) * glint;
      const thin = Math.max(0, h / hMax);                                       // crest: thin water lets light through
      const shade = (fr * sky + fr * sun + (1 - fr) * (0.06 + crest * thin * thin)) * haze[i];
      const c = sy * cols + sx;
      if (hitN[c] === 0) { touched[nt++] = c; shadeAt[c] = shade; } else if (shade > shadeAt[c]) shadeAt[c] = shade;
      if (hitN[c] < 255) hitN[c]++;
    }
    const counts = new Int32Array(LEVELS);
    for (let j = 0; j < nt; j++) {
      const c = touched[j], v = Math.min(1, shadeAt[c] * 1.7 + (hitN[c] - 1) * 0.05);
      hitN[c] = 0;
      const l = Math.min(LEVELS - 1, Math.floor(Math.pow(v, 0.75) * LEVELS));
      lists[l][counts[l]++] = c;
    }
    const sl = Math.round(LEVELS * 0.55);
    for (let j = 0; j < starCells.length; j++) if (Math.sin(t * 1.3 + starPhase[j]) > 0.1) lists[sl][counts[sl]++] = starCells[j];
    // paint: unlit layer, then each tone from Trough to Lit, then the word
    ctx.drawImage(grid, 0, 0);
    const D = hex(C.colDeep), ON = hex(C.colOn), s = size();
    for (let l = 0; l < LEVELS; l++) {
      const n = counts[l];
      if (!n) continue;
      const tl = l / (LEVELS - 1);
      ctx.fillStyle = `rgb(${D.map((d, j) => Math.round(d + (ON[j] - d) * tl)).join(',')})`;
      const L = lists[l];
      for (let j = 0; j < n; j++) ctx.fillRect((L[j] % cols) * cd + gap / 2, ((L[j] / cols) | 0) * cd + gap / 2, s, s);
    }
    drawWord(A, rt, swellAt);
  }

  function drawWord(A, rt, swellAt) {
    const n = WW * k, nk = K.length, toRows = F / z0, R = 8 * k;
    // the water under each column: the swells and the pointer's swell, and where its line falls
    for (let c = 0; c < n; c++) {
      let h = 0;
      for (let j = 0; j < nk; j++) h += A[j] * WS[j * n + c];
      HW[c] = h; HB[c] = swellAt(WX[c], z0);
      WL[c] = wl0 + Math.round(-(h * C.swell + HB[c] * C.lift) / 100 * toRows);
    }
    // each letter rides the mean of the water under it
    SPANS.forEach(([from, to], i) => {
      let sum = 0;
      for (let c = from * k; c < to * k; c++) sum += HW[c] * C.bob + HB[c] * C.lift;
      LD[i] = Math.round(-sum / 100 / ((to - from) * k) * toRows);
    });
    nm = 0;
    // letters: lit above the water line; under it dimmed, and bent by the water
    for (let gy = 0; gy < WH; gy++) for (let gx = 0; gx < WW; gx++) {
      if (WORD[gy][gx] !== '#') continue;
      const li = LETTER[gx], acc = li === 0, y0 = wtop + gy * k + LD[li];
      for (let v = 0; v < k; v++) {
        const y = y0 + v;
        if (y < 0 || y >= rows) continue;
        const bend = Math.round(Math.sin(y * 0.9 + rt * 2.2) * 0.75);
        for (let u = 0; u < k; u++) {
          const c = gx * k + u, x = wx0 + c;
          if (y <= WL[c]) { if (x >= 0 && x < cols) put(y * cols + x, acc ? LIT_ACC : LIT); }
          else if (x + bend >= 0 && x + bend < cols) put(y * cols + x + bend, acc ? SUB_ACC : SUB);
        }
      }
    }
    // the sea cleared one cell round the letters, above the water and under it, so they read against the dots
    const nLetters = nm;
    for (let j = 0; j < nLetters; j++) {
      const i = marked[j], x = i % cols, y = (i / cols) | 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const xx = x + dx, yy = y + dy;
        if (xx >= 0 && xx < cols && yy >= 0 && yy < rows) put(yy * cols + xx, HALO);
      }
    }
    // the reflection: what is lit above the water line, mirrored under it, swayed
    // further the deeper it goes, and fading; it breaks into streaks, every other
    // row lit and the rows between them calm water, with the sea's dots cleared
    for (let c = 0; c < n; c++) {
      const w = WL[c], x = wx0 + c;
      if (x < 0 || x >= cols) continue;
      for (let d = 1; d <= R; d++) {
        const y = w + d, ys = w + 1 - d;
        if (y >= rows) break;
        if (ys < 0) continue;
        const xs = x + Math.round(Math.sin(y * 0.7 + rt * 1.8) * (0.5 + 1.5 * d / R));
        if (xs < 0 || xs >= cols) continue;
        const m = mark[ys * cols + xs];
        if (m < LIT) continue;
        put(y * cols + x, d % 2 ? (m === LIT_ACC ? REFL_ACC : REFL) + Math.min(2, (3 * d / R) | 0) : HALO);
      }
    }
    // paint by colour, and clear the marks for the next frame
    for (let j = 0; j < nm; j++) { const i = marked[j]; buckets[mark[i]].push(i); mark[i] = 0; }
    const s = size();
    for (let v = 1; v < PAINT.length; v++) {
      const b = buckets[v];
      if (!b.length) continue;
      ctx.fillStyle = PAINT[v];
      for (const i of b) ctx.fillRect((i % cols) * cd + gap / 2, ((i / cols) | 0) * cd + gap / 2, s, s);
      b.length = 0;
    }
  }

  function loop(now) { frame(now); if (!reduce) requestAnimationFrame(loop); }

  cv.addEventListener('pointermove', (e) => {
    const r = cv.getBoundingClientRect();
    pointer.x = (e.clientX - r.left) / cell; pointer.y = (e.clientY - r.top) / cell; pointer.on = true;
  });
  cv.addEventListener('pointerleave', () => { pointer.on = false; });

  new IntersectionObserver((es) => { visible = es.some((e) => e.isIntersecting); }).observe(cv);
  fit();
  new ResizeObserver(() => fit()).observe(cv);
  if (!reduce) requestAnimationFrame(loop);
})();
</script>
</body>
</html>
