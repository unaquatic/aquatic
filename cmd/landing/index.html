<script>
  // Layout size for the [data-size] rules: lg, md or sm. Content runs the full
  // width with a fixed edge padding, so text starts on whole pixels (type16 is
  // only sharp there) without any centring maths.
  (function () {
    const de = document.documentElement;
    function fit() {
      const vw = de.clientWidth;
      de.dataset.size = vw >= 1152 ? 'lg' : vw >= 768 ? 'md' : 'sm';
    }
    fit();
    addEventListener('resize', fit);
  })();
</script>

  /* Sizes are 17, 34, 51 or 68px only (1, 2, 3, 4 px per font dot), with line
     heights that keep the baseline on a whole pixel. */
  :root {
    --bg: #111; --bg2: #161616; --surf: #1c1c1c; --line: #2a2a2a; --line2: #3a3a3a;
    --fg: #e6e6e6; --muted: #8a8a8a; --dim: #5c5c5c;
    --primary: #ff5f00; --primary-shade: #cc4c00;  /* shade: 80 % of primary, for offset shadows */
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }  /* beats display rules like .btn's */
  html { background: var(--bg); color: var(--fg); scroll-behavior: smooth; }
  body { margin: 0; font: 17px/27px "type16", ui-monospace, monospace; -webkit-font-smoothing: none; font-kerning: none;
         font-variant-ligatures: none; text-rendering: optimizeSpeed; }
  a { color: inherit; text-decoration: none; }
  ::selection { background: var(--primary); color: var(--bg); }
  :root { --pad-x: 40px; }
  .wrap { width: 100%; padding: 0 var(--pad-x); }  /* full width, no column: only an edge padding */
  section { padding: 92px 0; border-top: 2px solid var(--line); }
  .muted { color: var(--muted); }
  .dim { color: var(--dim); }
  .p { color: var(--primary); }
  h1, h2, h3, p { margin: 0; font-weight: normal; }
  h2 { font-size: 34px; line-height: 46px; }
  h3 { font-size: 17px; line-height: 23px; color: var(--fg); }
  .eyebrow { color: var(--muted); display: flex; gap: 14px; align-items: center; line-height: 23px; }
  .tag { background: var(--primary); color: var(--bg); padding: 2px 8px; line-height: 23px; }
  .lead { color: var(--muted); max-width: 540px; }

  /* logo: drawn by drawLogo() from the dots of "ƒlow" as type16 sets it with ss02; the
     Adjust sidebar's logo tab sets how. The box is the block only (a shadow overflows it). */
  .brand { display: block; }
  .mark { display: block; }

  /* buttons + install command */
  .btn { display: inline-flex; align-items: center; gap: 10px; padding: 10px 18px; line-height: 23px; border: 2px solid var(--line2);
         background: transparent; color: var(--fg); font: inherit; cursor: pointer; }
  .btn:hover { border-color: var(--fg); }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: var(--bg); box-shadow: 4px 4px 0 var(--primary-shade); }
  .btn.primary:hover { box-shadow: 2px 2px 0 var(--primary-shade); transform: translate(2px, 2px); }
  .btn.primary:active { box-shadow: none; transform: translate(4px, 4px); }
  .btn.small { padding: 6px 14px; }
  .cmd { display: inline-flex; align-items: baseline; gap: 14px;  /* baseline: whole pixels even when the command wraps */
         border: 2px solid var(--line); background: var(--surf); padding: 8px 8px 8px 16px; line-height: 23px; max-width: 100%; }
  .cmd code { font: inherit; }
  .cmd .copy { padding: 8px 16px; flex: none; text-transform: uppercase; }  /* COPY / COPIED; 43 px, like the bar's buttons: the command is 63 px tall */
  .copy { font: inherit; background: none; border: 2px solid var(--line2); color: var(--muted); padding: 0 10px; line-height: 23px; cursor: pointer; }
  .copy:hover { color: var(--fg); border-color: var(--fg); }
  .actions { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }

  /* full-screen dot-matrix sign */
  :root { --led-gap: #0a0a0a; --led-off: #141414; --led-on: #f4f4f4; }
  /* the dots fill the first view down to the bar */
  .screen { height: calc(100vh - 69px); min-height: 391px; display: flex; flex-direction: column; background: var(--led-gap); color: var(--led-on); }
  .screen canvas { flex: 1; min-height: 0; width: 100%; display: block; cursor: crosshair; }
  /* the bar under the dots: logo, adjust, Install, in the screen's colours. It is a
     child of body, not of the screen, so it can stick to the top as the header once the
     dots scroll away. Its inside is 65 px (odd), so the 43 px items, and the logo (an even
     height) with 1 px under it, sit on whole pixels. Its bottom line replaces the line on
     top of the section under it. */
  .screen-bar { position: sticky; top: 0; z-index: 10; min-height: 69px; background: var(--led-gap); color: var(--led-on);
                border-top: 2px solid var(--led-off); border-bottom: 2px solid var(--line); display: flex; align-items: center; }
  .below > section:first-child { border-top: 0; }  /* the bar's bottom line is the line on top of it */
  /* what is under the bar fills the view under it at least, so the page scrolls far
     enough for the bar to reach the top, the dots out of view, on any screen height */
  .below { min-height: calc(100vh - 69px); display: flex; flex-direction: column; }
  .below > .hero { flex: 1; }
  html { scroll-padding-top: 69px; }  /* anchors land under the stuck bar */
  .screen-bar .wrap { display: flex; align-items: center; gap: 24px; }
  .screen-bar .brand { margin-bottom: 1px; }
  .screen-bar .spacer { flex: 1; }
  .btn.led { background: var(--led-on); border-color: var(--led-on); color: var(--led-gap); }
  .btn.led:hover { background: transparent; color: var(--led-on); }
  /* adjust panels, shown with ?adjust in the URL: a full-height sidebar on the right,
     beside the page, not over it. While one is open (html.adjusting) the page narrows by
     the sidebar's width; the dots refit to the narrower canvas. On phones it covers the
     page instead. */
  :root { --side-w: 360px; }
  .ledpanel { position: fixed; top: 0; right: 0; bottom: 0; z-index: 20; width: var(--side-w); overflow: auto;
              background: var(--bg2); border-left: 2px solid var(--line2); padding: 16px; display: flex; flex-direction: column; gap: 8px; line-height: 23px; }
  html.adjusting body { margin-right: var(--side-w); }

  .ledpanel .ph { display: flex; justify-content: space-between; align-items: center; }
  .tabs { display: flex; }
  .tabs button { font: inherit; line-height: 23px; background: none; border: 2px solid var(--line2); color: var(--muted); padding: 0 12px; cursor: pointer; }
  .tabs button + button { margin-left: -2px; }
  .tabs button:hover { color: var(--fg); }
  .tabs button.on { background: var(--fg); border-color: var(--fg); color: var(--bg); position: relative; }
  .ledpanel h4 { margin: 10px 0 0; font-weight: normal; color: var(--muted); }
  .ledpanel > * { flex: none; }
  .ledpanel .pr { display: grid; grid-template-columns: 104px 1fr 80px; gap: 8px; align-items: center; }
  .ledpanel output { color: var(--muted); text-align: right; white-space: nowrap; }
  .ledpanel input[type=range] { width: 100%; margin: 0; accent-color: var(--primary); }
  .ledpanel input[type=color] { width: 40px; height: 27px; padding: 0; border: 2px solid var(--line2); background: none; cursor: pointer; }
  .ledpanel input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
  .ledpanel input[type=color]::-webkit-color-swatch { border: 0; }
  .ledpanel .chk { display: flex; gap: 8px; align-items: center; color: var(--muted); }
  .ledpanel input[type=checkbox] { accent-color: var(--primary); margin: 0; }
  .ledpanel select { font: inherit; background: var(--surf); color: var(--fg); border: 2px solid var(--line2); border-radius: 0; padding: 2px 6px; }
  .ledpanel .sw { display: flex; gap: 8px; align-items: center; }  /* on/off + colour */
  .ledpanel .note { color: var(--dim); }
  .btn.ghost-led { background: transparent; color: var(--led-on); }
  .btn.ghost-led:hover { background: var(--led-on); color: var(--led-gap); }
  .screen-bar .wrap > * { white-space: nowrap; }

  /* hero: the slogan and the install command beside the terminal, which is 62 cells of
     9 px, 16 px of padding and its border wide: 594 px; the text column takes the rest of
     the 1072 px a 1152 px window leaves inside the edge padding */
  .hero .cols { display: grid; grid-template-columns: 454px 594px; gap: 24px; align-items: start; }
  .hero .left { display: flex; flex-direction: column; gap: 23px; padding-top: 46px; }
  .slogan { font-size: 51px; line-height: 69px; color: var(--fg);
            font-feature-settings: "ss01"; text-rendering: auto; }  /* proportional set; auto, as optimizeSpeed can drop features */
  .hero .cmd { align-self: flex-start; }
  /* in place of the install command while flow is not published: a box of its height */
  .hero .soon { align-self: flex-start; border: 2px solid var(--line); background: var(--surf); color: var(--muted);
                padding: 18px 16px; line-height: 23px; }

  /* terminal: replays steps of internal/terminal/testdata/landing_demo.seq.golden, real
     frames of flow's UI, a cell a span column of 9 px (type16's advance at 17 px) and a
     row 23 px tall, the line height that keeps type16's baseline on a whole pixel */
  :root { --cw: 9px; --rh: 23px; }
  .term { border: 2px solid var(--line2); background: #1a1a1a; width: 594px; max-width: 100%; }
  .term-bar { display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-bottom: 2px solid var(--line); color: var(--muted); line-height: 23px; background: var(--surf); }
  .term-bar i { width: 20px; height: 20px; background: var(--line2); display: inline-block; }
  .term-bar .title { margin-left: 8px; flex: 1; }
  .term-bar button { font: inherit; background: none; border: 0; color: var(--dim); cursor: pointer; padding: 0; line-height: 23px; }
  .term-bar button:hover { color: var(--fg); }
  .term-body { padding: 12px 16px 16px; height: calc(var(--rows) * var(--rh) + 28px); overflow: hidden; color: #ececec; }  /* 16 px under the input box, as beside it */
  .trow { display: flex; height: var(--rh); line-height: var(--rh); white-space: pre; }
  .trow span { flex: none; overflow: hidden; }
  .trow .d { opacity: .6; } .trow .i { font-style: italic; } .trow .u { text-decoration: underline; } .trow .s { text-decoration: line-through; }
  /* box drawing: lines from the cell's centre to its edges, 2 px like the page's borders, so a table's lines meet
     across rows, which type16's glyphs, shorter than a row, would leave apart */
  .trow .bx { --l: linear-gradient(currentColor, currentColor); background-repeat: no-repeat; }
  /* the cursor: a block that blinks, as a terminal's does, on one clock however often the
     rows are drawn again (draw sets its delay); while text is typed it stays lit */
  .trow .cur { box-shadow: inset 0 0 0 99px #ececec; animation: blink 1.06s steps(1) infinite; }
  .trow .cur.typing { animation: none; }
  @keyframes blink { 50% { box-shadow: none; } }

  /* footer */
  footer { border-top: 2px solid var(--line); padding: 46px 0 69px; color: var(--muted); }
  footer .wrap { display: flex; gap: 24px; align-items: baseline; }
  footer a:hover { color: var(--fg); }
  /* ss01: type16's proportional set; text-rendering: auto, since optimizeSpeed (body) can drop font features */
  footer .fine { color: var(--dim); font-feature-settings: "ss01"; text-rendering: auto; margin-right: auto; }

  /* tablet: one column, the terminal under the text */
  [data-size=md] .hero .cols { grid-template-columns: 594px; gap: 46px; }
  [data-size=md] .hero .left { padding-top: 0; }
  /* phone */
  [data-size=sm] h2 { font-size: 17px; line-height: 27px; color: var(--primary); }
  [data-size=sm] section { padding: 69px 0; }
  [data-size=sm] .slogan { font-size: 34px; line-height: 46px; }
  [data-size=sm] { --pad-x: 20px; }
  [data-size=sm] .screen-bar .wrap { gap: 12px; }
  [data-size=sm] .ledpanel { left: 0; width: auto; border-left: 0; }
  html[data-size=sm].adjusting body { margin-right: 0; }
  [data-size=sm] .hero .cols { grid-template-columns: 100%; gap: 46px; }
  [data-size=sm] .hero .left { padding-top: 0; }
  [data-size=sm] .term-body { overflow-x: auto; }
  [data-size=sm] .cmd code { min-width: 0; overflow-wrap: anywhere; }  /* a long command breaks, so COPY stays in view */
  [data-size=sm] footer .wrap { flex-wrap: wrap; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .trow .cur { animation: none; } }
</style>
</head>
<body>

<header class="screen" id="top">
  <canvas id="screen" role="img" aria-label="The flow wordmark drawn in dots that ripple and spark, burst out in every direction and fly home from every side to draw it again"></canvas>
</header>
<nav class="screen-bar" aria-label="Main">
  <div class="wrap">
    <a class="brand" href="#top" aria-label="flow home"><!-- the favicon: the logo ƒ on primary, 16x16 dots, 3 px a dot --><svg width="48" height="48" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true" style="display: block"><rect width="16" height="16" fill="#ff5f00"/><path fill="#111111" d="M8 1h3v1h-3zM7 2h4v1h-4zM7 3h2v2h-2zM5 5h6v2h-6zM7 7h2v6h-2zM4 12h2v1h-2zM4 13h5v1h-5zM5 14h3v1h-3z"/></svg></a>
    <span class="spacer"></span>
    <button class="btn led small ghost-led" id="adjust" hidden aria-expanded="false" aria-controls="ledPanel logoPanel" title="Adjust the grid and the logo">Adjust</button>
    <a class="btn led small" href="#install">Install</a>
  </div>
</nav>

<aside class="ledpanel" id="ledPanel" hidden aria-label="Adjust the dot waves">
  <div class="ph"><div class="tabs"><button class="on" data-tab="ledPanel">grid</button><button data-tab="logoPanel">logo</button></div><button class="copy" data-close title="Close">close</button></div>
  <div class="actions"><button class="btn small" data-preset="night">night</button><button class="btn small" data-preset="orange">orange</button></div>
  <h4>Effect</h4>
  <div class="pr"><label for="fxSel">Effect</label><select id="fxSel" data-k="effect" title="How the dots move: the word's own dots scattering and gathering, or the sea"><option value="gather">gather</option><option value="sea">sea</option></select><output for="fxSel"></output></div>
  <h4>Gather</h4>
  <div class="pr"><label for="fxSpeed">Speed</label><input type="range" id="fxSpeed" data-k="fxSpeed" min="0" max="300" step="5" data-unit="%" title="How fast the dots move and the cycle runs"><output for="fxSpeed"></output></div>
  <div class="pr"><label for="gHold">Hold</label><input type="range" id="gHold" data-k="gatherHold" min="0" max="15" step="0.1" data-unit="s" title="Seconds the word holds, waving and sparking, before its dots fly out"><output for="gHold"></output></div>
  <div class="pr"><label for="gOut">Scatter</label><input type="range" id="gOut" data-k="gatherOut" min="0.5" max="10" step="0.1" data-unit="s" title="Seconds the dots fly out before they turn home"><output for="gOut"></output></div>
  <div class="pr"><label for="gBack">Gather</label><input type="range" id="gBack" data-k="gatherBack" min="0.5" max="10" step="0.1" data-unit="s" title="Seconds the dots take to fly home and draw the word"><output for="gBack"></output></div>
  <div class="pr"><label for="gWave">Wave</label><input type="range" id="gWave" data-k="gatherWave" min="0" max="300" step="5" data-unit="%" title="How far the wave that runs through the word lifts its dots; 0 holds it still"><output for="gWave"></output></div>
  <div class="pr"><label for="gSparkle">Sparks</label><input type="range" id="gSparkle" data-k="gatherSparkle" min="0" max="400" step="5" data-unit="%" title="How many of the word's dots pop out and spring back while it holds"><output for="gSparkle"></output></div>
  <div class="pr"><label for="gSpread">Spread</label><input type="range" id="gSpread" data-k="gatherSpread" min="0" max="300" step="5" data-unit="%" title="How far the dots fly out"><output for="gSpread"></output></div>
  <div class="pr"><label for="gSwirl">Swirl</label><input type="range" id="gSwirl" data-k="gatherSwirl" min="0" max="300" step="5" data-unit="%" title="How much the dots swirl on their way out and home"><output for="gSwirl"></output></div>
  <div class="pr"><label for="gTrail">Trails</label><input type="range" id="gTrail" data-k="gatherTrail" min="0" max="400" step="5" data-unit="%" title="How long the dots' trails stay; 0 draws none"><output for="gTrail"></output></div>
  <div class="actions"><button class="btn small" id="gatherAgain" title="Fly the dots out now, and home again">scatter now</button></div>
  <h4>Grid</h4>
  <div class="pr"><label for="ledCell">Cell size</label><input type="range" id="ledCell" data-k="cell" min="2" max="24" data-unit="px"><output for="ledCell"></output></div>
  <label class="chk"><input type="checkbox" data-auto="cell"> automatic cell size</label>
  <div class="pr"><label for="ledGapPx">Gap</label><input type="range" id="ledGapPx" data-k="gapPct" min="0" max="50" step="0.5" data-unit="%" title="Gap between cells, as a percentage of the cell size"><output for="ledGapPx"></output></div>
  <label class="chk"><input type="checkbox" data-auto="gap"> automatic gap</label>
  <div class="pr"><label for="ledRound">Roundness</label><input type="range" id="ledRound" data-k="round" min="0" max="50" data-unit="%"><output for="ledRound"></output></div>
  <h4>Colors</h4>
  <div class="pr"><label for="ledOn">Lit</label><input type="color" id="ledOn" data-k="colOn" title="Colour of the brightest dots: crests, glints, the word"><output for="ledOn"></output></div>
  <div class="pr"><label for="ledDeep">Trough</label><input type="color" id="ledDeep" data-k="colDeep" title="Colour of the darkest dots, in the wave troughs"><output for="ledDeep"></output></div>
  <div class="pr"><label for="ledOff">Unlit</label><input type="color" id="ledOff" data-k="colOff"><output for="ledOff"></output></div>
  <div class="pr"><label for="ledBg">Background</label><input type="color" id="ledBg" data-k="colGap"><output for="ledBg"></output></div>
  <h4>Ocean</h4>
  <div class="pr"><label for="wHeight">Wave height</label><input type="range" id="wHeight" data-k="height" min="0" max="300" step="5" data-unit="%"><output for="wHeight"></output></div>
  <div class="pr"><label for="wChop">Chop</label><input type="range" id="wChop" data-k="chop" min="40" max="300" step="5" data-unit="%" title="Higher = shorter, choppier waves"><output for="wChop"></output></div>
  <div class="pr"><label for="wDensity">Dots</label><input type="range" id="wDensity" data-k="density" min="20" max="300" step="5" data-unit="%"><output for="wDensity"></output></div>
  <div class="pr"><label for="wHorizon">Horizon</label><input type="range" id="wHorizon" data-k="horizon" min="0" max="70" data-unit="%"><output for="wHorizon"></output></div>
  <div class="pr"><label for="wStars">Stars</label><input type="range" id="wStars" data-k="stars" min="0" max="300" step="5" data-unit="%"><output for="wStars"></output></div>
  <h4>Light</h4>
  <div class="pr"><label for="lSunH">Sun height</label><input type="range" id="lSunH" data-k="sunHeight" min="0" max="80" data-unit="deg"><output for="lSunH"></output></div>
  <div class="pr"><label for="lSunD">Sun direction</label><input type="range" id="lSunD" data-k="sunDir" min="-80" max="80" data-unit="deg"><output for="lSunD"></output></div>
  <div class="pr"><label for="lGlint">Glints</label><input type="range" id="lGlint" data-k="glint" min="0" max="300" step="5" data-unit="%" title="Sun mirrored by the wave faces"><output for="lGlint"></output></div>
  <div class="pr"><label for="lCrest">Crest light</label><input type="range" id="lCrest" data-k="crest" min="0" max="300" step="5" data-unit="%" title="Light through the thin water at the wave tops"><output for="lCrest"></output></div>
  <h4>Word</h4>
  <label class="chk"><input type="checkbox" data-k="word"> float the wordmark on the sea</label>
  <div class="pr"><label for="wdSize">Size</label><input type="range" id="wdSize" data-k="wordSize" min="20" max="90" data-unit="%" title="Width of the word, as a percentage of the canvas width; its height stays under 40 % of the sea"><output for="wdSize"></output></div>
  <div class="pr"><label for="wdLine">Waterline</label><input type="range" id="wdLine" data-k="waterline" min="10" max="90" data-unit="%" title="Where the word floats, as a percentage of the sea's height from the horizon down"><output for="wdLine"></output></div>
  <div class="pr"><label for="wdBob">Bob</label><input type="range" id="wdBob" data-k="bob" min="0" max="100" step="5" data-unit="%" title="How far the letters ride the waves"><output for="wdBob"></output></div>
  <div class="pr"><label for="wdSwell">Water line</label><input type="range" id="wdSwell" data-k="swell" min="0" max="100" step="5" data-unit="%" title="How far the water line moves with the waves under the letters"><output for="wdSwell"></output></div>
  <label class="chk"><input type="checkbox" data-k="wordAccent"> the ƒ in primary</label>
  <h4>Motion</h4>
  <div class="pr"><label for="wSpeed">Speed</label><input type="range" id="wSpeed" data-k="speed" min="0" max="400" step="5" data-unit="%"><output for="wSpeed"></output></div>
  <div class="pr"><label for="wStart">Start time</label><input type="range" id="wStart" data-k="startTime" min="0" max="120" step="0.1" data-unit="s" title="The moment of the waves the page opens on; they move on from there at Speed (at 0 % they stay on it)"><output for="wStart"></output></div>
  <label class="chk"><input type="checkbox" data-auto="start"> random start time</label>
  <label class="chk"><input type="checkbox" data-k="bend"> the pointer stirs the dots</label>
  <div class="actions"><button class="btn small" id="ledCopy">copy settings</button><button class="btn small" id="ledReset">reset</button></div>
</aside>

<aside class="ledpanel" id="logoPanel" hidden aria-label="Adjust the logo">
  <div class="ph"><div class="tabs"><button data-tab="ledPanel">grid</button><button class="on" data-tab="logoPanel">logo</button></div><button class="copy" data-close title="Close">close</button></div>
  <div class="actions"><button class="btn small" data-logo-preset="pixel">pixel</button><button class="btn small" data-logo-preset="cut">cut out</button><button class="btn small" data-logo-preset="letters">letters</button></div>
  <h4>Size</h4>
  <div class="pr"><label for="lgScale">Scale</label><input type="range" id="lgScale" data-k="logoScale" min="1" max="4" data-unit="px" title="Size of a logo dot, in CSS pixels"><output for="lgScale"></output></div>
  <div class="pr"><label for="lgPadX">Padding x</label><input type="range" id="lgPadX" data-k="logoPadX" min="0" max="8" data-unit=" dots" title="Space between the letters and the left and right edges of the block"><output for="lgPadX"></output></div>
  <div class="pr"><label for="lgPadY">Padding y</label><input type="range" id="lgPadY" data-k="logoPadY" min="0" max="8" data-unit=" dots" title="Space between the letters and the top and bottom edges of the block"><output for="lgPadY"></output></div>
  <div class="pr"><label for="lgRadius">Corners</label><input type="range" id="lgRadius" data-k="logoRadius" min="0" max="6" step="0.5" data-unit=" dots" title="Corner radius of the block"><output for="lgRadius"></output></div>
  <h4>Colors</h4>
  <div class="pr"><label for="lgBlock">Block</label><span class="sw"><input type="checkbox" data-k="logoBlock" aria-label="Draw the block"><input type="color" id="lgBlock" data-k="colLogo" data-toggle="logoBlock" data-off="none" title="The grid presets set this: white for night, orange for orange"></span><output for="lgBlock"></output></div>
  <div class="pr"><label for="lgNoise">Noise</label><input type="range" id="lgNoise" data-k="logoNoise" min="0" max="40" data-unit="%" title="How much darker the block's dots can get than the block colour; 0 is a flat colour"><output for="lgNoise"></output></div>
  <div class="pr"><label for="lgSeed">Pattern</label><input type="range" id="lgSeed" data-k="logoSeed" min="1" max="50" title="Which noise pattern"><output for="lgSeed"></output></div>
  <div class="pr"><label for="lgFg">Letters</label><span class="sw"><input type="checkbox" data-k="logoFgOn" aria-label="Fill the letters"><input type="color" id="lgFg" data-k="logoFg" data-toggle="logoFgOn" data-off="cut out"></span><output for="lgFg"></output></div>
  <div class="pr"><label for="lgAccent" title="Colour of the first letter, the ƒ">Accent</label><span class="sw"><input type="checkbox" data-k="logoAccentOn" aria-label="Colour the first letter"><input type="color" id="lgAccent" data-k="logoAccent" data-toggle="logoAccentOn" data-off="same" title="Colour of the first letter, the ƒ"></span><output for="lgAccent"></output></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
// ?adjust in the URL shows the Adjust sidebar and keeps its settings; without it the
// page shows its defaults, whatever a sidebar saved
const adjustable = new URLSearchParams(location.search).has('adjust');

// --- copy buttons ---------------------------------------------------------
for (const b of document.querySelectorAll('.copy[data-copy]')) {
  b.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(b.dataset.copy); } catch { /* clipboard blocked */ }
    b.textContent = 'copied';
    setTimeout(() => { b.textContent = 'copy'; }, 1200);
  });
}

// --- logo -----------------------------------------------------------------
// "ƒlow" as type16 sets it with ss02 ("Wordmark": the logo ƒ, the wordmark l
// and w), read dot by dot from the font's own rendering. Rows top to bottom;
// the first letter runs up to the first empty column. The sea's word is drawn
// from the same rows.
const LOGO_ROWS = [
  '....###.###...................',
  '...####.###...................',
  '...##....##...................',
  '...##....##...................',
  '.######..##...######..##....##',
  '.######..##..########.##....##',
  '...##....##..##....##.##....##',
  '...##....##..##....##.##....##',
  '...##....##..##....##.##....##',
  '...##....##..##....##.##....##',
  '...##....##..##....##.##.##.##',
  '...##....##..##....##.########',
  '##.##...####.########.########',
  '#####...####..######...##..##.',
  '.###..........................',
];
const LOGO_FIRST = [...LOGO_ROWS[0]].findIndex((_, x) => LOGO_ROWS.every((r) => r[x] === '.'));
// Draws every svg.mark from the logo settings (cfg.logo*, cfg.colLogo): the
// letters filled or cut out of a block, logoPadX dots left and right of them
// and logoPadY above and below, logoScale px per dot. With logoNoise every
// block dot takes one of NOISE_LEVELS shades from the block colour down to
// logoNoise % darker, picked by a hash of its spot and logoSeed (stable across
// redraws), lighter shades more often. Without a gap or roundness each colour
// is one path of runs, crisp at any scale; with them every dot is a rect of
// its own. The svg's layout box is the block; a shadow overflows it, like a
// box-shadow.
const NOISE_LEVELS = 4;
function noiseHash(x, y, seed) {  // 0 <= h < 1
  let h = Math.imul(x + 1, 374761393) ^ Math.imul(y + 1, 668265263) ^ Math.imul(seed + 1, 2246822519);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function drawLogo(c) {
  const px = c.logoPadX, py = c.logoPadY, s = c.logoScale, W = LOGO_ROWS[0].length + 2 * px, H = LOGO_ROWS.length + 2 * py;
  const n = (v) => +v.toFixed(3);
  const fg = c.logoFgOn ? c.logoFg : '', first = c.logoAccentOn ? c.logoAccent : fg;
  const base = [1, 3, 5].map((i) => parseInt(c.colLogo.slice(i, i + 2), 16)), noise = c.logoNoise / 100;
  const block = (x, y) => {
    if (!c.logoBlock) return '';
    if (!noise) return c.colLogo;
    const level = Math.min(NOISE_LEVELS - 1, Math.floor(noiseHash(x, y, c.logoSeed) ** 2 * NOISE_LEVELS));
    const t = 1 - noise * level / (NOISE_LEVELS - 1);
    return '#' + base.map((v) => Math.round(v * t).toString(16).padStart(2, '0')).join('');
  };
  const colorAt = (x, y) => LOGO_ROWS[y - py]?.[x - px] !== '#' ? block(x, y) : x - px < LOGO_FIRST ? first : fg;  // '' = not drawn
  const layers = new Map(), all = [];  // colour -> its dots, row by row; all drawn dots
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const col = colorAt(x, y);
    if (!col) continue;
    if (!layers.has(col)) layers.set(col, []);
    layers.get(col).push([x, y]); all.push([x, y]);
  }
  // logoGap is a percentage of a dot, exact like the grid's gap (not snapped):
  // gaps that are not whole screen pixels are antialiased, so every value shows.
  const gap = c.logoGap / 100, round = c.logoRound / 100, dots = gap > 0 || round > 0;
  function shape(cells, fill) {
    if (dots) {
      const size = n(1 - gap), rx = round ? ` rx="${n(round * size)}"` : '';
      return `<g fill="${fill}">` + cells.map(([x, y]) => `<rect x="${n(x + gap / 2)}" y="${n(y + gap / 2)}" width="${size}" height="${size}"${rx}/>`).join('') + '</g>';
    }
    // runs of dots in a row, stacked into taller rects where rows repeat
    const rects = [], open = new Map();
    for (let i = 0; i < cells.length;) {
      const [x, y] = cells[i];
      let j = i + 1;
      while (j < cells.length && cells[j][1] === y && cells[j][0] === x + j - i) j++;

      for (let j = 0; j < nk; j++) h += A[j] * WS[j * n + c];
      HW[c] = h; HB[c] = swellAt(WX[c], z0);
      WL[c] = wl0 + Math.round(-(h * cfg.swell + HB[c] * 45) / 100 * toRows);
    }
    // each letter rides the mean of the water under it; the pointer's swell lifts it as it lifts the water
    SPANS.forEach(([a, b], i) => {
      let sum = 0;
      for (let c = a * k; c < b * k; c++) sum += HW[c] * cfg.bob + HB[c] * 45;
      LD[i] = Math.round(-sum / 100 / ((b - a) * k) * toRows);
    });
    nm = 0;
    // letters: lit above the water line; under it dimmed, and bent by the water
    for (let gy = 0; gy < WH; gy++) for (let gx = 0; gx < WW; gx++) {
      if (WORD[gy][gx] !== '#') continue;
      const li = LETTER[gx], acc = li === 0, y0 = wtop + gy * k + LD[li];
      for (let v = 0; v < k; v++) {
        const y = y0 + v;
        if (y < 0 || y >= rows) continue;
        const bend = Math.round(Math.sin(y * 0.9 + rt * 2.2) * 0.75);
        for (let u = 0; u < k; u++) {
          const c = gx * k + u, x = wx0 + c;
          if (y <= WL[c]) { if (x >= 0 && x < cols) put(y * cols + x, acc ? LIT_ACC : LIT); }
          else if (x + bend >= 0 && x + bend < cols) put(y * cols + x + bend, acc ? SUB_ACC : SUB);
        }
      }
    }
    // the sea cleared one cell round the letters, above the water and under it, so they read against the dots
    const nLetters = nm;
    for (let j = 0; j < nLetters; j++) {
      const i = marked[j], x = i % cols, y = (i / cols) | 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const xx = x + dx, yy = y + dy;
        if (xx >= 0 && xx < cols && yy >= 0 && yy < rows) put(yy * cols + xx, HALO);
      }
    }
    // the reflection: what is lit above the water line, mirrored under it, swayed
    // further the deeper it goes, and fading; it breaks into streaks, every other
    // row lit and the rows between them calm water, with the sea's dots cleared
    for (let c = 0; c < n; c++) {
      const w = WL[c], x = wx0 + c;
      if (x < 0 || x >= cols) continue;
      for (let d = 1; d <= R; d++) {
        const y = w + d, ys = w + 1 - d;
        if (y >= rows) break;
        if (ys < 0) continue;
        const xs = x + Math.round(Math.sin(y * 0.7 + rt * 1.8) * (0.5 + 1.5 * d / R));
        if (xs < 0 || xs >= cols) continue;
        const m = mark[ys * cols + xs];
        if (m < LIT) continue;
        put(y * cols + x, d % 2 ? (m === LIT_ACC ? REFL_ACC : REFL) + Math.min(2, (3 * d / R) | 0) : HALO);
      }
    }
    // paint by colour, and clear the marks for the next frame
    for (let j = 0; j < nm; j++) { const i = marked[j]; buckets[mark[i]].push(i); mark[i] = 0; }
    const P = wordPaint(), s = size(), rad = radius();
    for (let v = 1; v < P.length; v++) {
      const b = buckets[v];
      if (!b.length) continue;
      ctx.fillStyle = P[v];
      if (rad > 0) { const p = new Path2D(); for (const i of b) cellRect(p, i % cols, (i / cols) | 0); ctx.fill(p); }
      else for (const i of b) ctx.fillRect((i % cols) * cd + gap / 2, ((i / cols) | 0) * cd + gap / 2, s, s);
      b.length = 0;
    }
  }
  // --- gather -----------------------------------------------------------------
  // The word's own dots, LOGO_ROWS at k cells a font dot, in the middle, the ƒ's
  // in primary. The page opens on the word; it holds, a wave running through it
  // and sparks popping out of it and back, then its dots burst out in every
  // direction on a swirling flow, and fly home from every side to draw it
  // again, over and over: cfg.gatherHold, gatherOut and gatherBack seconds,
  // faster or slower by cfg.fxSpeed. cfg.gatherWave says how far the wave
  // lifts the dots, cfg.gatherSparkle how many sparks pop, cfg.gatherSpread
  // how far the dots fly, cfg.gatherSwirl how much they swirl, and
  // cfg.gatherTrail how long their trails stay. The pointer scatters the dots
  // near it, and they find their way back.
  //
  // The trails are fx.F, a brightness per cell from 0 to 1, which fxCompose
  // paints in the sea's LEVELS tones from Trough to Lit, through one image a
  // pixel a cell, scaled up, with the grid's gaps drawn over it; the dots are
  // painted over them.
  const rgba = ([r, g, b]) => ((255 << 24) | (b << 16) | (g << 8) | r) >>> 0;
  const fx = {
    F: new Float32Array(0),          // trail brightness per cell
    img: null, px: null, off: document.createElement('canvas'), gaps: document.createElement('canvas'),
    tones: new Uint32Array(LEVELS), on: 0, acc: 0,
    t: 0, last: 0,
  };
  const EFFECTS = {};  // name -> { init(), step(dt, t), draw(px) }; cfg.effect 'sea' is the sea

  // A slowly turning, swirling flow with no sources or sinks: the curl of a sum
  // of travelling sine waves. flowAt writes its velocity at x, y (cells) and
  // time t into out, at most about 1.
  let TERMS = [];
  function flowTerms() {
    const rand = rng(77), span = Math.max(cols, rows);
    TERMS = [[1.7, 1], [2.8, 0.7], [4.3, 0.45], [6.8, 0.3]].map(([m, wgt]) => {
      const ang = rand() * Math.PI * 2, kk = Math.PI * 2 / (span / m);
      return { kx: kk * Math.cos(ang), ky: kk * Math.sin(ang), ux: Math.sin(ang), uy: -Math.cos(ang),
        w: (0.15 + rand() * 0.3) * (rand() < 0.5 ? -1 : 1), p: rand() * Math.PI * 2, wgt: wgt / 1.6 };
    });
  }
  function flowAt(x, y, t, out) {
    let u = 0, v = 0;
    for (const T of TERMS) {
      const c = Math.cos(T.kx * x + T.ky * y + T.w * t + T.p) * T.wgt;
      u += c * T.ux; v += c * T.uy;
    }
    out[0] = u; out[1] = v;
  }
  // trail brightness v along the line from x0, y0 to x1, y1, a cell at a time,
  // keeping a brighter trail where there is one
  function streak(x0, y0, x1, y1, v) {
    const n = Math.min(64, Math.ceil(Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)))), F = fx.F;
    for (let s = n ? 1 : 0; s <= n; s++) {
      const x = n ? x0 + (x1 - x0) * s / n : x1, y = n ? y0 + (y1 - y0) * s / n : y1;
      if (x < 0 || y < 0 || x >= cols || y >= rows) continue;
      const i = (y | 0) * cols + (x | 0);
      if (F[i] < v) F[i] = v;
    }
  }

  function fxInit() {
    if (!EFFECTS[cfg.effect]) return;
    fx.F = new Float32Array(cols * rows);
    fx.off.width = cols; fx.off.height = rows;
    fx.img = fx.off.getContext('2d').createImageData(cols, rows); fx.px = new Uint32Array(fx.img.data.buffer);
    const D = hex(cfg.colDeep), ON = hex(cfg.colOn);
    for (let l = 0; l < LEVELS; l++) { const tl = l / (LEVELS - 1); fx.tones[l] = rgba(D.map((d, j) => Math.round(d + (ON[j] - d) * tl))); }
    const acc = cfg.wordAccent && cfg.colGap.toLowerCase() !== PRIMARY.toLowerCase() ? PRIMARY : cfg.colOn;
    fx.on = rgba(ON); fx.acc = rgba(hex(acc));
    // the gaps: the grid's background colour between the cells, over the image
    fx.gaps.width = cv.width; fx.gaps.height = cv.height;
    const tile = document.createElement('canvas'); tile.width = tile.height = cd;
    const tg = tile.getContext('2d'), s = size(), rad = radius();
    tg.fillStyle = cfg.colGap; tg.fillRect(0, 0, cd, cd);
    tg.globalCompositeOperation = 'destination-out'; tg.beginPath();
    if (rad > 0) tg.roundRect(gap / 2, gap / 2, s, s, rad); else tg.rect(gap / 2, gap / 2, s, s);
    tg.fill();
    const g = fx.gaps.getContext('2d');
    g.fillStyle = g.createPattern(tile, 'repeat'); g.fillRect(0, 0, fx.gaps.width, fx.gaps.height);
    fx.t = 0; fx.last = 0;
    flowTerms();
    EFFECTS[cfg.effect].init();
  }

  function fxFrame(now) {
    const e = EFFECTS[cfg.effect];
    const dt = fx.last ? Math.min(0.05, (now - fx.last) / 1000) : 1 / 30;
    fx.last = now;
    pointer.a += ((pointer.on && cfg.bend ? 1 : 0) - pointer.a) * 0.15;
    const sp = cfg.fxSpeed / 100;
    fx.t += dt * sp;
    if (!reduce) e.step(dt * sp, fx.t);
    fxCompose(e.draw);
  }

  function fxCompose(draw) {
    const { F, px, tones } = fx;
    for (let i = 0; i < F.length; i++) {
      const v = F[i];
      px[i] = v < 0.05 ? 0 : tones[Math.min(LEVELS - 1, (Math.pow(v, 0.75) * LEVELS) | 0)];
    }
    draw(px);
    fx.off.getContext('2d').putImageData(fx.img, 0, 0);
    ctx.drawImage(grid, 0, 0);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(fx.off, 0, 0, cols * cd, rows * cd);
    ctx.drawImage(fx.gaps, 0, 0);
  }

  EFFECTS.gather = (() => {
    let n = 0, HX = new Float32Array(0), HY = new Float32Array(0), X = new Float32Array(0), Y = new Float32Array(0);
    let VX = new Float32Array(0), VY = new Float32Array(0), DEL = new Float32Array(0), SPD = new Float32Array(0);
    let DX = new Float32Array(0), DY = new Float32Array(0), ACC = new Uint8Array(0), SPK = new Float32Array(0);
    let v0 = 1, cx = 0, cy = 0, wordW = 1, rand = rng(9);
    function init() {
      // the word's cells, in the middle, where the dots start
      const top = Math.round((rows - WH * k) / 2), homes = [];
      for (let gy = 0; gy < WH; gy++) for (let gx = 0; gx < WW; gx++) {
        if (WORD[gy][gx] !== '#') continue;
        for (let v = 0; v < k; v++) for (let u = 0; u < k; u++) homes.push([wx0 + gx * k + u + 0.5, top + gy * k + v + 0.5, LETTER[gx] === 0]);
      }
      n = homes.length; rand = rng(9);
      HX = new Float32Array(n); HY = new Float32Array(n); X = new Float32Array(n); Y = new Float32Array(n);
      VX = new Float32Array(n); VY = new Float32Array(n); DEL = new Float32Array(n); SPD = new Float32Array(n);
      DX = new Float32Array(n); DY = new Float32Array(n); ACC = new Uint8Array(n); SPK = new Float32Array(n);
      cx = wx0 + WW * k / 2; cy = top + WH * k / 2; wordW = WW * k;
      const hw = WW * k / 2, hh = WH * k / 2;
      for (let i = 0; i < n; i++) {
        const [hx, hy, acc] = homes[i];
        X[i] = HX[i] = hx; Y[i] = HY[i] = hy; ACC[i] = acc ? 1 : 0;
        SPD[i] = 0.5 + rand();
        // its way out: from the word's middle through its home, in the word's own
        // proportions, so that dots fly up and down as much as sideways, turned a little
        const a = Math.atan2((hy - cy) / hh, (hx - cx) / hw) + (rand() - 0.5) * 1.2;
        DX[i] = Math.cos(a); DY[i] = Math.sin(a);
        const r = Math.hypot((hx - cx) / hw, (hy - cy) / hh);
        DEL[i] = rand() * 0.5 + Math.max(0, 1 - r) * 0.3;  // the outer dots lift off first
      }
      v0 = Math.max(cols, rows) / 7;
    }
    // how far the wave lifts the dots of column x at time t, in cells: a ripple that
    // runs through the word left to right, a little more than one across it at a time
    const waveAt = (x, t) => cfg.gatherWave / 100 * Math.max(0.6, 0.3 * k) * Math.sin((x - cx) / wordW * Math.PI * 2 * 1.3 - t * 2.6);
    const vel = [0, 0];
    const smooth = (x) => { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); };  // 0 to 1, easing in and out
    function step(dt, t) {
      const hold = cfg.gatherHold, out = cfg.gatherOut, back = cfg.gatherBack, cycle = hold + out + back;
      const spread = cfg.gatherSpread / 100, swirl = cfg.gatherSwirl / 100, R = 18;
      const f = Math.exp(-dt * 7 / Math.max(0.05, cfg.gatherTrail / 100)), F = fx.F;
      for (let i = 0; i < F.length; i++) F[i] *= f;
      const c = t % cycle, holding = c < hold;
      // sparks: while the word holds, a few of its dots at a time pop out, arc away
      // on a loose spring for a moment, and spring back home
      if (holding && n) {
        const pops = n * 0.006 * cfg.gatherSparkle / 100 * dt;
        for (let j = Math.floor(pops) + (rand() < pops % 1 ? 1 : 0); j > 0; j--) {
          const i = (rand() * n) | 0, a = rand() * Math.PI * 2, s = v0 * (0.35 + rand() * 0.45);
          VX[i] += Math.cos(a) * s; VY[i] += Math.sin(a) * s; SPK[i] = 0.35 + rand() * 0.4;
        }
      }
      for (let i = 0; i < n; i++) {
        let ax = 0, ay = 0;
        const tx = HX[i], ty = HY[i] + waveAt(HX[i], t);  // home, as the wave moves it
        const away = c - hold - DEL[i];
        if (c >= hold && c < hold + out && away >= 0) {  // flying out, in every direction, on a flow finer than the word
          if (away < dt * 1.5) { VX[i] += DX[i] * v0 * 0.7 * spread * SPD[i]; VY[i] += DY[i] * v0 * 0.7 * spread * SPD[i]; }
          // the outward drive eases off over the last part of the flight, so the dots
          // slow down and drift before they turn home
          const ease = 1 - smooth(((c - hold) / out - 0.5) / 0.5);
          flowAt(X[i] * 4, Y[i] * 4, t * 1.5, vel);
          const tu = (DX[i] * 0.5 * spread * ease + vel[0] * 1.4 * swirl) * v0 * SPD[i];
          const tv = (DY[i] * 0.5 * spread * ease + vel[1] * 1.4 * swirl) * v0 * SPD[i];
          const g = Math.min(1, dt * 1.5);
          VX[i] += (tu - VX[i]) * g; VY[i] += (tv - VY[i]) * g;
        } else if (c >= hold + out) {  // flying home
          // each dot steers toward home, as a bird turns, not as a spring pulls: at a
          // speed that builds up over the first part of the way and slows near home,
          // swirling less as it nears home, and steering harder toward the end
          const b = (c - hold - out) / back;
          const dx = tx - X[i], dy = ty - Y[i], d = Math.hypot(dx, dy) || 1e-6;
          const speed = Math.min(d * 3, v0 * (0.25 + 2.2 * smooth(b / 0.6)));
          let ux = dx / d * speed, uy = dy / d * speed;
          flowAt(X[i] * 4, Y[i] * 4, t * 1.5, vel);
          const sw = v0 * 0.8 * swirl * (1 - b) * Math.min(1, d / 20) * SPD[i];
          ux += vel[0] * sw; uy += vel[1] * sw;
          const g = Math.min(1, dt * (1.5 + 8 * b * b));
          VX[i] += (ux - VX[i]) * g; VY[i] += (uy - VY[i]) * g;
        } else {          // home: held by a spring that firms up as the hold begins, so stragglers
          // settle in, not snap; a loose one while the dot sparks
          const s = SPK[i] > 0 ? 6 : 12 + 78 * smooth(c / 0.8);
          if (SPK[i] > 0) SPK[i] -= dt;
          ax = s * (tx - X[i]) - 2 * Math.sqrt(s) * VX[i]; ay = s * (ty - Y[i]) - 2 * Math.sqrt(s) * VY[i];
        }
        if (pointer.a > 0.02) {
          const dx = X[i] - pointer.x, dy = Y[i] - pointer.y, r = Math.hypot(dx, dy);
          if (r < R && r > 0.01) { const p = (1 - r / R) * v0 * 40 * pointer.a; ax += dx / r * p; ay += dy / r * p; }
        }
        VX[i] += ax * dt; VY[i] += ay * dt;
        const x = X[i] + VX[i] * dt, y = Y[i] + VY[i] * dt;
        if (Math.hypot(x - tx, y - ty) > 0.8) streak(X[i], Y[i], x, y, 0.3);
        X[i] = x; Y[i] = y;
      }
    }
    function draw(px) {
      for (let i = 0; i < n; i++) {
        const x = X[i] | 0, y = Y[i] | 0;
        if (x >= 0 && y >= 0 && x < cols && y < rows) px[y * cols + x] = ACC[i] ? fx.acc : fx.on;
      }
    }
    // scatter starts the cycle's flight out now
    const scatter = () => { fx.t = cfg.gatherHold; };
    return { init, step, draw, scatter };
  })();

  function loop(now) { frame(now); if (!reduce) requestAnimationFrame(loop); }

  cv.addEventListener('pointermove', (e) => {
    const r = cv.getBoundingClientRect();
    pointer.x = (e.clientX - r.left) / cell; pointer.y = (e.clientY - r.top) / cell; pointer.on = true;
  });
  cv.addEventListener('pointerleave', () => { pointer.on = false; });

  // --- adjust panels ------------------------------------------------------
  const panel = $('#ledPanel'), logoPanel = $('#logoPanel'), fields = [...document.querySelectorAll('.ledpanel [data-k]')];
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(cfg)); } catch { /* ignore */ } };
  function panelSync() {
    const sc = document.documentElement.style;  // the bar under the dots uses the same colours
    sc.setProperty('--led-gap', cfg.colGap); sc.setProperty('--led-off', cfg.colOff); sc.setProperty('--led-on', cfg.colOn);
    for (const el of fields) {
      const k = el.dataset.k;
      const gridGap = k === 'logoGap' && cfg.logoGapGrid;  // the logo shows the grid's gap
      if (el.type === 'checkbox') el.checked = !!cfg[k];
      else if (document.activeElement !== el) el.value = gridGap ? gapPct : k === 'startTime' ? startAt() : cfg[k];
      const out = el.id && document.querySelector(`output[for="${el.id}"]`);
      if (out) out.textContent = el.dataset.toggle && !cfg[el.dataset.toggle] ? el.dataset.off  // colour switched off
        : k === 'cell' && cfg.cell <= 0 ? `auto ${autoCell}` : k === 'gapPct' && cfg.gapPct < 0 ? `auto ${+gapPct.toFixed(2)}%`
        : k === 'startTime' && cfg.startTime < 0 ? `random ${randomStart}s`
        : gridGap ? `grid ${+gapPct.toFixed(2)}%`
        : el.value + (el.dataset.unit === ' dots' && Math.abs(el.value) === 1 ? ' dot' : el.dataset.unit || '');
    }
    for (const el of panel.querySelectorAll('[data-auto]')) el.checked = { cell: cfg.cell <= 0, gap: cfg.gapPct < 0, start: cfg.startTime < 0 }[el.dataset.auto];
    $('#ledCell').value = cell; $('#ledGapPx').value = gapPct;
    drawLogo(cfg.logoGapGrid ? { ...cfg, logoGap: gapPct } : cfg);
  }
  const REFIT = new Set(['cell', 'gapPct', 'round', 'colGap', 'colOff', 'colOn', 'colDeep', 'chop', 'density', 'horizon', 'stars', 'height', 'wordSize', 'waterline', 'word', 'wordAccent', 'effect']);
  for (const el of fields) el.addEventListener('input', () => {
    const k = el.dataset.k;
    cfg[k] = el.type === 'checkbox' ? el.checked : el.type === 'range' || el.type === 'number' ? +el.value : el.value;
    if (el.dataset.toggle) cfg[el.dataset.toggle] = true;  // picking a colour switches it on
    if (k === 'logoGap') cfg.logoGapGrid = false;           // moving the logo's gap takes it off the grid's
    if (k === 'logoGapGrid' && !cfg.logoGapGrid) cfg.logoGap = +gapPct.toFixed(1);  // and unlinking keeps the gap shown
    save();
    if (isLogoKey(k)) panelSync();
    else if (REFIT.has(k)) fit(); else { panelSync(); frame(performance.now(), true); }
  });
  for (const el of panel.querySelectorAll('[data-auto]')) el.addEventListener('input', () => {
    const a = el.dataset.auto;
    if (a === 'cell') cfg.cell = el.checked ? 0 : cell;
    else if (a === 'gap') cfg.gapPct = el.checked ? -1 : gapPct;
    else cfg.startTime = el.checked ? -1 : randomStart;  // unticking keeps the time shown
    save();
    if (a === 'start') { panelSync(); frame(performance.now(), true); } else fit();
  });
  for (const b of panel.querySelectorAll('[data-preset]')) b.addEventListener('click', () => {
    Object.assign(cfg, PRESETS[b.dataset.preset]); save(); fit();
  });
  for (const b of logoPanel.querySelectorAll('[data-logo-preset]')) b.addEventListener('click', () => {
    Object.assign(cfg, LOGO_PRESETS[b.dataset.logoPreset]);
    if (b.dataset.logoPreset === 'pixel') cfg.logoFg = presetLogo().logoFg;  // letters that show on this grid's block
    save(); panelSync();
  });
  // one "Adjust" button opens the sidebar on the tab last shown; the grid / logo tabs switch it
  let shown = panel;
  const adjust = $('#adjust');
  adjust.hidden = !adjustable;
  const showPanel = (p) => {  // null closes it
    if (p) shown = p;
    for (const q of [panel, logoPanel]) q.hidden = q !== p;
    document.documentElement.classList.toggle('adjusting', !!p);  // the page makes room for it
    adjust.setAttribute('aria-expanded', String(!!p));
    if (p) panelSync();
  };
  adjust.addEventListener('click', () => showPanel(panel.hidden && logoPanel.hidden ? shown : null));
  for (const b of document.querySelectorAll('[data-tab]')) b.addEventListener('click', () => showPanel($('#' + b.dataset.tab)));
  for (const b of document.querySelectorAll('[data-close]')) b.addEventListener('click', () => showPanel(null));
  // grid reset keeps the logo, but its colours follow the night preset it returns to
  $('#ledReset').addEventListener('click', () => {
    for (const k in DEFAULTS) if (!isLogoKey(k) || k === 'colLogo' || k === 'logoFg') cfg[k] = DEFAULTS[k];
    save(); fit();
  });
  $('#logoReset').addEventListener('click', () => {
    for (const k in DEFAULTS) if (isLogoKey(k)) cfg[k] = DEFAULTS[k];
    const p = presetLogo(); cfg.colLogo = p.colLogo; cfg.logoFg = p.logoFg;
    save(); panelSync();
  });
  // copy the settings of one panel that differ from the defaults
  const copyDiff = async (e, keep) => {
    const diff = Object.fromEntries(Object.entries(cfg).filter(([k, v]) => keep(k) && v !== DEFAULTS[k]));
    try { await navigator.clipboard.writeText(JSON.stringify(diff, null, 2)); } catch { /* clipboard blocked */ }
    e.target.textContent = 'copied'; setTimeout(() => { e.target.textContent = 'copy settings'; }, 1200);
  };
  $('#ledCopy').addEventListener('click', (e) => copyDiff(e, (k) => !isLogoKey(k)));
  $('#gatherAgain').addEventListener('click', () => { if (EFFECTS[cfg.effect]?.scatter) EFFECTS[cfg.effect].scatter(); });
  $('#logoCopy').addEventListener('click', (e) => copyDiff(e, isLogoKey));

  new IntersectionObserver((es) => { visible = es.some((e) => e.isIntersecting); }).observe(cv);
  fit();
  new ResizeObserver(() => fit()).observe(cv);
  if (!reduce) requestAnimationFrame(loop);
})();

// --- terminal replay ------------------------------------------------------
// Plays steps of the golden frames in #demo-frames, real frames of flow's UI,
// LandingWidth cells wide (internal/terminal/landing_test.go):
//   - #demo: a shell runs flow; the prompt is typed into the input box (the
//     "typed" step, revealed a cell at a time) and sent; then the transcript
//     of the turn appears a block at a time, the blocks parted by its blank
//     rows: text a word at a time, as replies stream, and each call's row
//     first without its status, while it runs. The "running" step's
//     indicator counts the turn's time under it, and the "idle" input box
//     follows the transcript's last block, the footer that times the turn.
// Like a terminal running flow inline, the screen holds the newest rows. With
// reduced motion each shows its last frame.
(() => {
  const doc = $('#demo-frames').textContent;
  if (!doc.trim()) return;
  // steps: name -> rows of cells {ch, fg, bg, at}, the colours from the step's legend
  const steps = {};
  {
    let raw = null, sec = null;
    for (const line of doc.split('\n')) {
      let m;
      if ((m = /^=== step: (.+) ===$/.exec(line))) { raw = steps[m[1]] = { text: [], fg: [], bg: [], attrs: [], legend: [] }; continue; }
      if ((m = /^=== (text|fg|bg|attrs|legend) ===$/.exec(line))) { sec = m[1]; continue; }
      if (raw && sec && line) raw[sec].push(sec === 'legend' ? line : [...line.slice(1, -1)]);
    }
    for (const [name, raw] of Object.entries(steps)) {
      const legend = new Map(raw.legend.map((l) => { const sym = [...l][0]; return [sym, l.slice(sym.length + 1).split(' ')[0]]; }));
      // an attribute's letter, or a combination's letters from the legend (fg colours use letters too)
      const at = (sym) => !sym || sym === ' ' ? '' : /[1-9]/.test(sym) ? legend.get(sym) || '' : sym;
      steps[name] = raw.text.map((row, y) => row.map((ch, x) => ({
        ch, fg: legend.get(raw.fg[y]?.[x]) || null, bg: legend.get(raw.bg[y]?.[x]) || null, at: at(raw.attrs[y]?.[x]),
      })));
    }
  }
  const W = steps.transcript[0].length;
  const blankCell = { ch: ' ', fg: null, bg: null, at: '' };
  const blankRow = () => Array.from({ length: W }, () => blankCell);
  const isBlank = (row) => row.every((c) => c.ch === ' ' && !c.bg);
  const textOf = (row) => row.map((c) => c.ch).join('');
  // a row with cells past column n blanked, keeping backgrounds: text typed or streamed so far
  const upTo = (row, n) => row.map((c, x) => (x < n ? c : { ...blankCell, bg: c.bg }));
  // a row with the terminal's cursor at column x; typing: text is being typed at it, so it does not blink
  const withCursor = (row, x, typing = false) => row.map((c, i) => (i === x ? { ...c, ch: ' ', cur: typing ? 'typing' : 'blink' } : c));
  // a row whose text runs from column 2, one colour, as the indicator draws its line
  const lineRow = (text, like) => { const r = blankRow(), fg = like.find((c) => c.ch !== ' ')?.fg; [...text].forEach((ch, i) => { r[2 + i] = { ch, fg, bg: null, at: '' }; }); return r; };

  // box-drawing characters, as the lines from a cell's centre that they draw: up, right, down, left
  const BOX = { '─': 'rl', '│': 'ud', '┌': 'rd', '┐': 'dl', '└': 'ur', '┘': 'ul', '├': 'urd', '┤': 'udl', '┬': 'rdl', '┴': 'url', '┼': 'urdl' };
  const css = getComputedStyle(document.documentElement), CW = parseFloat(css.getPropertyValue('--cw')), RH = parseFloat(css.getPropertyValue('--rh'));
  const LINE = 2;  // px: the stroke of the page's borders
  const CX = Math.floor((CW - LINE) / 2), CY = Math.floor((RH - LINE) / 2);  // the lines' top left corner in a cell
  const SEG = {  // background position and size of each line
    u: [`${CX}px 0`, `${LINE}px ${CY + LINE}px`], d: [`${CX}px ${CY}px`, `${LINE}px ${RH - CY}px`],
    l: [`0 ${CY}px`, `${CX + LINE}px ${LINE}px`], r: [`${CX}px ${CY}px`, `${CW - CX}px ${LINE}px`],
  };
  // draws rows (the newest rows, a screen's worth) into body: a span for each run of
  // cells of one style, and one for each box-drawing cell, its lines drawn as backgrounds
  function draw(body, rowsShown, screen) {
    const all = rowsShown.length > screen ? rowsShown.slice(-screen) : rowsShown;
    const frag = document.createDocumentFragment();
    for (const row of all) {
      const div = document.createElement('div');
      div.className = 'trow';
      for (let x = 0; x < row.length;) {
        const c = row[x], box = BOX[c.ch];
        let j = x + 1;
        while (!box && !c.cur && j < row.length && !BOX[row[j].ch] && !row[j].cur && row[j].fg === c.fg && row[j].bg === c.bg && row[j].at === c.at) j++;
        const span = document.createElement('span');
        span.style.width = `calc(${j - x} * var(--cw))`;
        if (c.fg) span.style.color = c.fg;
        if (c.bg) span.style.backgroundColor = c.bg;
        if (box) {
          const segs = [...box].map((s) => SEG[s]);
          span.className = 'bx';
          span.style.backgroundImage = segs.map(() => 'var(--l)').join();
          span.style.backgroundPosition = segs.map((s) => s[0]).join();
          span.style.backgroundSize = segs.map((s) => s[1]).join();
        } else span.textContent = row.slice(x, j).map((d) => d.ch).join('');
        for (const a of c.at) span.classList.add(a.toLowerCase());
        if (c.cur) { span.classList.add('cur', c.cur); span.style.animationDelay = `-${Math.round(performance.now() % 1060)}ms`; }
        div.append(span);
        x = j;
      }
      frag.append(div);
    }
    body.replaceChildren(frag);
  }

  // a player runs script(api) in a loop while its terminal is on screen; replay restarts it
  function player(term, script) {
    const body = $('.term-body', term), screen = +getComputedStyle(term).getPropertyValue('--rows');
    let run = 0, onScreen = false, wake = null;
    const show = (rowsShown) => draw(body, rowsShown, screen);
    // waits ms, while the terminal is on screen; false once a newer run started
    const sleep = (ms, id) => new Promise((resolve) => {
      const step = () => {
        if (id !== run) return resolve(false);
        if (!onScreen) { wake = step; return; }
        setTimeout(() => resolve(id === run), ms);
      };
      step();
    });
    const start = async () => {
      const id = ++run;
      while (id === run) {
        if (!(await script({ show, sleep: (ms) => sleep(ms, id) }))) return;
      }
    };
    new IntersectionObserver((es) => {
      onScreen = es.some((e) => e.isIntersecting);
      if (onScreen && wake) { const w = wake; wake = null; w(); }
    }).observe(term);
    $('[data-replay]', term)?.addEventListener('click', start);
    return start;
  }

  // the transcript's blocks: rows parted by blank rows, each with the blank rows before it
  const T = steps.transcript;
  const blocks = [];
  for (let y = 0; y < T.length;) {
    const gapStart = y;
    while (y < T.length && isBlank(T[y])) y++;
    const from = y;
    while (y < T.length && !isBlank(T[y])) y++;
    if (from < y) blocks.push({ gap: T.slice(gapStart, from), rows: T.slice(from, y) });
  }
  // the input box's steps without the blank rows under the box (its footer, empty here),
  // so the box sits as far from the terminal's bottom edge as from its sides
  const trimEnd = (rows) => { let n = rows.length; while (n && isBlank(rows[n - 1])) n--; return rows.slice(0, n); };
  const typed = trimEnd(steps.typed), running = trimEnd(steps.running), idle = trimEnd(steps.idle);
  const promptRow = typed.findIndex((r) => textOf(r).trim());
  const promptLen = textOf(typed[promptRow]).trim().length;
  // rows that hold the input box, with the cursor in it where the text starts: on the
  // box's text row, which is promptRow rows below its top, as in the typed step
  const withInputCursor = (rows) => { const top = rows.findIndex((r) => r.some((c) => c.bg)); return rows.map((r, y) => (y === top + promptRow ? withCursor(r, 2) : r)); };
  const idleInput = withInputCursor(idle), runningInput = withInputCursor(running.slice(1));
  const TURN_SECONDS = +(/Worked for (\d+)s/.exec(textOf(T.at(-1)))?.[1] ?? 36);
  const shell = (text, cursor) => { const r = blankRow(); [...('~/calculator $ ' + text)].forEach((ch, i) => { r[i] = { ch, fg: i < 15 ? '#707070' : '#ececec', bg: null, at: '' }; }); return cursor ? withCursor(r, 15 + text.length, text.length > 0) : r; };

  // The turn once sent, a frame at a time: the transcript so far and how long it
  // shows. Text comes a word at a time, row by row, as replies stream, a table a
  // row at a time, and each call's row first without its status, while it runs.
  // The last block, the footer that times the turn, shows once the turn ends.
  function* turnFrames() {
    const shown = [];
    for (const [i, b] of blocks.slice(0, -1).entries()) {
      shown.push(...b.gap);
      if (i === 0) { shown.push(...b.rows); yield [shown.slice(), 700]; continue; }  // the prompt, sent
      if (b.rows.every((r) => r[2]?.at.includes('B'))) {  // calls' rows start with the tool's name in bold
        for (const r of b.rows) {
          const text = textOf(r), status = text.lastIndexOf(' [');
          const head = status > 0 && text.trimEnd().endsWith(']') ? status : text.trimEnd().length;
          shown.push(upTo(r, head)); yield [shown.slice(), 520];
          shown[shown.length - 1] = r; yield [shown.slice(), 160];
        }
        continue;
      }
      const table = b.rows.some((r) => /[┌│└]/.test(r[0].ch));
      for (const r of b.rows) {
        if (table) { shown.push(r); yield [shown.slice(), 70]; continue; }
        shown.push(upTo(r, 0));
        for (const m of textOf(r).matchAll(/\S+/g)) { shown[shown.length - 1] = upTo(r, m.index + m[0].length); yield [shown.slice(), 26]; }
      }
      yield [shown.slice(), 240];
    }
  }
  // the turn's frames and how long they take, so the indicator counts to TURN_SECONDS as they end
  const TURN = [...turnFrames()], TURN_MS = TURN.reduce((n, [, ms]) => n + ms, 0), footer = blocks.at(-1);

  const main = player($('#demo'), async ({ show, sleep }) => {
    // the shell, then flow's empty input box
    for (let i = 0; i <= 4; i++) { show([shell('flow'.slice(0, i), true)]); if (!(await sleep(i ? 90 : 700))) return false; }
    const top = [shell('flow')];
    show([...top, ...idleInput]);
    if (!(await sleep(600))) return false;
    // the prompt, typed
    for (let n = 0; n <= promptLen; n++) {
      show([...top, ...typed.map((r, y) => (y === promptRow ? withCursor(upTo(r, 2 + n), 2 + n, n < promptLen) : r))]);
      if (!(await sleep(n === promptLen ? 500 : 28 + Math.random() * 40))) return false;
    }
    // sent: the transcript, a blank row, then the indicator and the input box, as flow
    // draws them inline; the indicator shows the time the turn has run so far
    let elapsed = 0;
    for (const [rows, ms] of TURN) {
      const secs = Math.min(TURN_SECONDS - 1, Math.floor(elapsed / TURN_MS * TURN_SECONDS));
      show([...top, ...rows, blankRow(), lineRow(textOf(running[0]).trim().replace(/\d+s/, `${secs}s`), running[0]), ...runningInput]);
      if (!(await sleep(ms))) return false;
      elapsed += ms;
    }
    // the turn ended: its footer, and the empty input box
    show([...top, ...TURN.at(-1)[0], ...footer.gap, ...footer.rows, blankRow(), ...idleInput]);
    return sleep(7000);
  });

  if (reduce) {
    draw($('#demo .term-body'), [...T, ...idleInput], +getComputedStyle($('#demo')).getPropertyValue('--rows'));
  } else main();
})();
</script>
</body>
</html>
